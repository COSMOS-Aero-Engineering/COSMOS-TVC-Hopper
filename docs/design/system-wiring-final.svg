<text class="t tiny" x="710.0" y="700.0" text-anchor="middle">수신기 5V 신호 → Teensy 3.3V</text>
<text class="t warn" x="710.0" y="718.0" text-anchor="middle">직결 금지 — Teensy 4.0 은 5V 비관용</text>
