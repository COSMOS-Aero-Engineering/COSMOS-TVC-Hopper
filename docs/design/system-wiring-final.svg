<text class="t tiny" x="995.0" y="543.0" text-anchor="middle">CH1 스로틀 · CH2 롤 · CH3 피치 · CH4 요 · CH5 킬</text>
<text class="t tiny" x="995.0" y="560.0" text-anchor="middle">전원 5V(UBEC) · 안테나 2개 서로 90°</text>
<text class="t tiny" x="995.0" y="580.0" text-anchor="middle">iBUS 아님 — 스톡 펌웨어가 PWM 을 읽는다</text>
<text class="t tiny" x="995.0" y="598.0" text-anchor="middle">안테나는 전원선에서 30mm 이상 이격</text>
