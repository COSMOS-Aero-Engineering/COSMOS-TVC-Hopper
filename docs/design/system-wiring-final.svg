<text class="t lbl" x="600.0" y="806.0" text-anchor="start">공통 GND (별 접지) — 배터리(−)=ESC(−)=UBEC(−)=만능기판 GND 버스=Teensy GND=수신기 GND</text>
<rect class="note" x="28.0" y="828.0" width="1184.0" height="56.0" rx="6"/>
<text class="t lblb" x="44.0" y="848.0" text-anchor="start">전원 인가 순서 · 필독</text>
<text class="t lbl" x="44.0" y="866.0" text-anchor="start">① USB 로 Teensy 만 → ② UBEC·수신기(킬 스위치 동작 확인) → ③ 마지막에 배터리 메인. 끌 때는 역순.  |  Teensy VIN 에 UBEC 5V 를 넣으려면 먼저 뒷면 VUSB 패드를 잘라야 한다(§3.4).</text>
