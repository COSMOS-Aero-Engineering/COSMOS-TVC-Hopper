<rect class="bg" x="0.0" y="0.0" width="1240.0" height="900.0" rx="0"/>
<text class="t title" x="28.0" y="34.0" text-anchor="start">COSMOS 호퍼 — 전체 결선도 (비행 형상, rev C.1)</text>
<text class="t sub" x="28.0" y="54.0" text-anchor="start">01-avionics-integration-final.md §2(핀맵)·§3(전원)·§6(하네스)와 1:1. 굵은 빨강 = 배터리 메인(최대 50A) / 주황 = 5V / 파랑 = 신호 / 점선 = 공통 GND</text>
<rect class="hot" x="40.0" y="96.0" width="250.0" height="58.0" rx="5"/>
<text class="t lblb" x="165.0" y="118.0" text-anchor="middle">4S LiPo 1300mAh 75C</text>
<text class="t tiny" x="165.0" y="136.0" text-anchor="middle">14.8~16.8V · XT60 · 배터리 선반(+Y)</text>
<rect class="box" x="40.0" y="186.0" width="250.0" height="52.0" rx="5"/>
<text class="t lblb" x="165.0" y="206.0" text-anchor="middle">물리 킬스위치 (≥80A, 인라인)</text>
<text class="t tiny" x="165.0" y="223.0" text-anchor="middle">배터리 (+) 경로 · 상시 손 닿는 위치</text>
