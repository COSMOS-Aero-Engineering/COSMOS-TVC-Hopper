<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COSMOS 호퍼 뷰어</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <strong>COSMOS 호퍼 뷰어</strong>
      <label class="file">CSV 열기 <input id="file" type="file" accept=".csv" /></label>
      <select id="sample" aria-label="예제 CSV">
        <option value="">예제 선택</option>
        <option value="samples/sim-pd-nodr-s0.csv">시뮬레이션 PD (랜덤화 끔, seed 0)</option>
        <option value="samples/axis-test.csv">축 변환 확인용</option>
      </select>
      <button id="camera-default" type="button" aria-pressed="true">기본 시점</button>
      <button id="camera-below" type="button" aria-pressed="false">베인 아래에서 보기</button>
      <span id="status">CSV를 열거나 예제를 고른다</span>
    </header>
    <main>
      <div id="view"></div>
      <aside id="readout">
        <div>t <b id="t">-</b> ms</div>
        <div>mode <b id="mode">-</b></div>
        <div>Roll φ <b id="phi">-</b>°</div>
        <div>Pitch θ <b id="theta">-</b>°</div>
        <div>Yaw ψ <b id="psi">-</b>°</div>
        <div>throttle <b id="throttle">-</b></div>
        <section aria-label="베인 번호와 정규화 서보값">
          <h2>베인 · 서보값</h2>
          <p class="hint">기체 기준 방향 · 정규화 값</p>
          <div><span class="swatch" id="vane-color-1" aria-hidden="true"></span>1 FWD <b id="servo1">-</b></div>
          <div><span class="swatch" id="vane-color-2" aria-hidden="true"></span>2 LEFT <b id="servo2">-</b></div>
          <div><span class="swatch" id="vane-color-3" aria-hidden="true"></span>3 AFT <b id="servo3">-</b></div>
          <div><span class="swatch" id="vane-color-4" aria-hidden="true"></span>4 RIGHT <b id="servo4">-</b></div>
        </section>
      </aside>
    </main>
    <footer>
      <button id="play" disabled>재생</button>
      <input id="seek" type="range" min="0" max="0" value="0" disabled aria-label="시간" />
      <select id="speed" aria-label="배속">
        <option value="1">1×</option>
        <option value="0.25">0.25×</option>
      </select>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
