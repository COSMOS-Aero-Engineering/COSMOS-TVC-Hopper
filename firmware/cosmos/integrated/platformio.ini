; Include only the SPI driver from imu_test, without copying its sources.
[platformio]
src_dir = ..
default_envs = teensy40

[env:teensy40]
platform = platformio/teensy@6.0.0
board = teensy40
framework = arduino
monitor_speed = 115200
build_src_filter = +<integrated/src/*.cpp> +<imu_test/src/BNO080.cpp>
build_unflags = -ffast-math

[env:teensy40_cli]
extends = env:teensy40
upload_protocol = teensy-cli
