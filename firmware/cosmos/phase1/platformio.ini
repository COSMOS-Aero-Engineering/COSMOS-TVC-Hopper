; COSMOS PRJ-01 — phase1 PHASE 1 롤 PD 스케치
; IMU 롤 각도를 읽어 서보 1개(핀 2)에 PD 제어로 펄스폭을 낸다. 모터·ESC 연결 금지.
; 선행: #235(서보 단독), #238(IMU 부호), #245(IMU 연결 방식).
; 빌드: pio run          업로드: pio run -t upload          시리얼 모니터: pio device monitor
; macOS 업로드: pio run -e teensy40_cli -t upload   (#91)

[platformio]
default_envs = teensy40

[env:teensy40]
platform = platformio/teensy@6.0.0
board = teensy40
framework = arduino
monitor_speed = 115200

[env:teensy40_cli]
extends = env:teensy40
upload_protocol = teensy-cli
