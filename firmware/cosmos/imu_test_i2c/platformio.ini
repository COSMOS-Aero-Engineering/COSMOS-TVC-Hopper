; COSMOS PRJ-01 — imu_test_i2c
; BNO085를 I2C 4선(3V·G·18·19)으로만 연결해 살아 있는지 확인하는 브링업 스케치.
; 2026-10-15 실물에서 0x4B로 인식·자세값 출력 확인. 최종 배선은 ../imu_test (SPI).
; 빌드: pio run          업로드: pio run -t upload          시리얼 모니터: pio device monitor

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200
