; COSMOS PRJ-01 — servo_bench
; 시리얼로 서보 번호(1-2)와 펄스폭(µs)을 받아 서보 하나를 움직인다. 서보 보정(#243)·베인 응답 실측(#202)용.
; 빌드: pio run          업로드: pio run -t upload          시리얼 모니터: pio device monitor
; macOS 업로드: pio run -e teensy40_cli -t upload   (#91)

[platformio]
; env를 지정하지 않은 pio run·pio run -t upload(CI, Windows)는 teensy40만 처리한다.
default_envs = teensy40

[env:teensy40]
platform = platformio/teensy@6.0.0
board = teensy40
framework = arduino
monitor_speed = 115200

; macOS용 업로드 env. teensy40 설정을 그대로 쓰고 업로드 방식만 teensy-cli로 바꾼다.
; teensy-gui(기본값)는 Teensy Loader 앱을 찾지 못하면 업로드가 실패한다(#91).
[env:teensy40_cli]
extends = env:teensy40
upload_protocol = teensy-cli
