# Temporary probe for issue #165. Removed in the next commit of the same PR; never reaches main.
# Question: can an agent reproduce a group-policy execution policy (MachinePolicy scope) on a
# windows-latest runner, so that such checks need not go to a member's real PC?
# Method: write the registry values that the "Turn on Script Execution" policy writes
# (HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell), then run the README uv install line.
# All steps use cmd so the runner's own PowerShell step scripts are not blocked by the policy.
name: tmp-165 gp probe (temporary)

on:
  push:
    branches: [docs/165]
    paths: ['.github/workflows/tmp-165-gp-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environment before
        shell: cmd
        run: |
          ver
          echo PSExecutionPolicyPreference=%PSExecutionPolicyPreference%
          if exist "%USERPROFILE%\.local\bin\uv.exe" (echo uv.exe already in .local\bin & exit /b 1)
          powershell -NoProfile -Command "'PS ' + $PSVersionTable.PSVersion; Get-ExecutionPolicy -List | Out-String"
          powershell -NoProfile -Command "Get-MpComputerStatus | Select-Object AMServiceEnabled,AntivirusEnabled,RealTimeProtectionEnabled,IsTamperProtected | Format-List | Out-String"
          exit /b 0

      - name: Emulate group policy (MachinePolicy AllSigned)
        shell: cmd
        run: |
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell" /v EnableScripts /t REG_DWORD /d 1 /f || exit /b 1
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell" /v ExecutionPolicy /t REG_SZ /d AllSigned /f || exit /b 1
          set PSExecutionPolicyPreference=
          powershell -NoProfile -Command "Get-ExecutionPolicy -List | Out-String; 'Effective: ' + (Get-ExecutionPolicy)"
          powershell -NoProfile -Command "if ((Get-ExecutionPolicy -Scope MachinePolicy).ToString() -ne 'AllSigned') { exit 1 }"
          if errorlevel 1 (echo MachinePolicy is not AllSigned & exit /b 1)
          echo GP EMULATED: MachinePolicy AllSigned
          exit /b 0

      - name: README uv line under emulated group policy must fail with the policy error
        shell: cmd
        run: |
          set PSExecutionPolicyPreference=
          findstr /B /C:"powershell -ExecutionPolicy ByPass" README.md > cmdline.txt
          type cmdline.txt
          set /p LINE=<cmdline.txt
          %LINE% > gp.log 2>&1
          set rc=%ERRORLEVEL%
          type gp.log
          echo README line under GP exit=%rc%
          findstr /C:"requires an execution policy" gp.log > nul || (echo policy error text not found & exit /b 1)
          if exist "%USERPROFILE%\.local\bin\uv.exe" (echo uv.exe installed despite GP & exit /b 1)
          echo GP RESULT: README line refused, uv.exe not installed
          exit /b 0

      - name: Control - remove emulated policy, the same line must install uv
        shell: cmd
        run: |
          reg delete "HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell" /f || exit /b 1
          set PSExecutionPolicyPreference=
          powershell -NoProfile -Command "Get-ExecutionPolicy -List | Out-String"
          set /p LINE=<cmdline.txt
          %LINE% > ctl.log 2>&1
          set rc=%ERRORLEVEL%
          type ctl.log
          echo README line without GP exit=%rc%
          if not exist "%USERPROFILE%\.local\bin\uv.exe" (echo uv.exe not installed & exit /b 1)
          "%USERPROFILE%\.local\bin\uv.exe" --version
          echo CONTROL OK: uv installed without GP
          exit /b 0
