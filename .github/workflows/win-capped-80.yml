# #80 확인용 임시 워크플로. PR #82(infra/37)의 Windows `ship.py capped`를 GitHub Windows 러너에서
# #80 절차대로 실행한다. 이 파일은 infra/80 브랜치에만 있고 main에 머지하지 않는다.
#
# 각 단계는 출력과 종료 코드를 그대로 찍고, #80의 판정 기준과 다르면 실패한다.
# 64비트(x64)와 32비트(x86) 파이썬을 따로 돌린다. 5단계(tasks.py check)는 torch가 32비트를
# 지원하지 않아서 x64에서만 돌린다.
name: Windows capped 확인 (#80)

on:
  push:
    branches: [infra/80]
  workflow_dispatch:

jobs:
  capped:
    name: capped — Windows ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: 환경
        run: |
          python -c "import sys, struct, platform; print(sys.version); print(struct.calcsize('P') * 8, 'bit'); print(platform.platform())"
          Write-Output "pwsh $($PSVersionTable.PSVersion)"

      # 대조군: 상한이 없으면 400MB 할당이 성공해야 2단계의 실패가 상한 때문이라고 말할 수 있다.
      - name: 대조 — 상한 없이 400MB 할당은 성공한다
        run: |
          $ErrorActionPreference = 'Continue'
          $out = python -c "x=bytearray(400*1024*1024); print('ok')" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out "exit=$code"
          if ($code -ne 0 -or $out -notmatch '(?m)^ok\s*$') { exit 1 }
          exit 0

      - name: "#80 2단계 — 200M 상한에서 400MB 할당은 실패한다"
        run: |
          $ErrorActionPreference = 'Continue'
          $out = python ship.py capped 200M -- python -c "x=bytearray(400*1024*1024)" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out "exit=$code"
          if ($code -eq 0 -or $out -notmatch 'MemoryError') { exit 1 }
          exit 0

      - name: "#80 3단계 — 200M 상한에서 100MB 할당은 성공한다"
        run: |
          $ErrorActionPreference = 'Continue'
          $out = python ship.py capped 200M -- python -c "x=bytearray(100*1024*1024); print('ok')" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out "exit=$code"
          if ($code -ne 0 -or $out -notmatch '(?m)^ok\s*$') { exit 1 }
          exit 0

      - name: "#80 4단계 — 손자 프로세스도 상한을 받는다"
        run: |
          $ErrorActionPreference = 'Continue'
          $out = python ship.py capped 200M -- python -c "import subprocess,sys; sys.exit(subprocess.run([sys.executable,'-c','x=bytearray(400*1024*1024)']).returncode)" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out "exit=$code"
          if ($code -eq 0 -or $out -notmatch 'MemoryError') { exit 1 }
          exit 0

      # ship.py가 쓴 구조체를 쓰지 않고, 오프셋을 손으로 계산해서 Windows가 돌려준 값을 읽는다.
      # 64비트: 크기 144, JobMemoryLimit 오프셋 120. 32비트: 크기 112, 오프셋 100.
      # LimitFlags는 둘 다 오프셋 16. hJob=NULL이면 호출한 프로세스의 가장 안쪽 Job을 읽는다.
      - name: Job 설정값 읽기 — 상한 209715200, 플래그 0x2200
        run: |
          $ErrorActionPreference = 'Continue'
          $probe = Join-Path $env:RUNNER_TEMP 'probe_job.py'
          @'
          import ctypes, struct, sys
          from ctypes import wintypes
          ptr = ctypes.sizeof(ctypes.c_void_p)
          size, off_limit, fmt = (144, 120, "<Q") if ptr == 8 else (112, 100, "<I")
          k32 = ctypes.WinDLL("kernel32", use_last_error=True)
          k32.QueryInformationJobObject.argtypes = (wintypes.HANDLE, ctypes.c_int, ctypes.c_void_p,
                                                    wintypes.DWORD, ctypes.POINTER(wintypes.DWORD))
          k32.QueryInformationJobObject.restype = wintypes.BOOL
          buf = ctypes.create_string_buffer(size)
          ret = wintypes.DWORD()
          if not k32.QueryInformationJobObject(None, 9, buf, size, ctypes.byref(ret)):
              raise ctypes.WinError(ctypes.get_last_error())
          flags = struct.unpack_from("<I", buf.raw, 16)[0]
          limit = struct.unpack_from(fmt, buf.raw, off_limit)[0]
          print(f"bits={ptr * 8} returned={ret.value} LimitFlags=0x{flags:x} JobMemoryLimit={limit}")
          sys.exit(0 if (ret.value, flags, limit) == (size, 0x2200, 200 * 1024 * 1024) else 1)
          '@ | Set-Content -Encoding utf8 $probe
          $out = python ship.py capped 200M -- python $probe 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out "exit=$code"
          exit $code

      # 대조군과 비교한다: 상한 없이 띄운 손자는 부모가 끝나도 살아서 표시 파일을 쓴다.
      # capped 안에서 띄운 손자는 ship.py가 끝나 Job 핸들이 닫힐 때 같이 끝나서 표시 파일을 못 쓴다.
      - name: KILL_ON_JOB_CLOSE — ship.py가 끝나면 남은 손자도 끝난다
        run: |
          $ErrorActionPreference = 'Continue'
          $orphan = Join-Path $env:RUNNER_TEMP 'orphan.py'
          @'
          import subprocess, sys
          marker = sys.argv[1]
          code = f"import time; time.sleep(15); open({marker!r}, 'w').write('alive')"
          subprocess.Popen([sys.executable, "-c", code], stdin=subprocess.DEVNULL,
                           stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          print("grandchild started; parent exits now")
          '@ | Set-Content -Encoding utf8 $orphan
          $free = Join-Path $env:RUNNER_TEMP 'free.txt'
          $capped = Join-Path $env:RUNNER_TEMP 'capped.txt'
          python $orphan $free
          python ship.py capped 200M -- python $orphan $capped
          $code = $LASTEXITCODE
          Start-Sleep -Seconds 25
          $freeAlive = Test-Path $free
          $cappedAlive = Test-Path $capped
          Write-Output "ship.py exit=$code; uncapped grandchild wrote marker=$freeAlive; capped grandchild wrote marker=$cappedAlive"
          if ($code -ne 0 -or -not $freeAlive -or $cappedAlive) { exit 1 }
          exit 0

      - name: 64비트 — 8G 상한도 걸린다
        if: matrix.arch == 'x64'
        run: |
          $ErrorActionPreference = 'Continue'
          $out = python ship.py capped 8G -- python -c "print('ran')" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out "exit=$code"
          if ($code -ne 0 -or $out -notmatch '(?m)^ran\s*$') { exit 1 }
          exit 0

      - name: 32비트 — SIZE_T를 넘는 8G 상한은 [중단]으로 멈춘다
        if: matrix.arch == 'x86'
        run: |
          $ErrorActionPreference = 'Continue'
          $out = python ship.py capped 8G -- python -c "print('ran')" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out "exit=$code"
          if ($code -eq 0 -or $out -notmatch 'SIZE_T' -or $out -match '(?m)^ran\s*$') { exit 1 }
          exit 0

      - uses: astral-sh/setup-uv@v6
        if: matrix.arch == 'x64'
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: "#80 5단계 준비 — python tasks.py setup"
        if: matrix.arch == 'x64'
        run: python tasks.py setup

      - name: "#80 5단계 — capped 8G에서 python tasks.py check"
        if: matrix.arch == 'x64'
        run: |
          python ship.py capped 8G -- python tasks.py check
          $code = $LASTEXITCODE
          Write-Output "exit=$code"
          exit $code
