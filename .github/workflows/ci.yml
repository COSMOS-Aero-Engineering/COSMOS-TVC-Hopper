# COSMOS CI — PR이 main에 들어가기 전에 sim 검사와 펌웨어 빌드를 자동으로 돌린다.
#
# 잡으려는 사고: 누가 코드를 고쳤는데 그게 깨진 채로 main에 들어가서,
# 다음 사람이 git pull 받은 뒤에야 "내가 뭘 잘못했나?" 하고 헤매는 것.
# 오래 걸리는 PPO 본 학습(`train`)은 돌리지 않는다. job마다 돌리는 것:
#   - sim: `python tasks.py check`, 그리고 학습 자료 목록·내부 링크 검사.
#     check가 돌리는 단계는 `python tasks.py graph`의 check 줄을 본다. 여기에 옮겨 적지 않는다.
#   - firmware: PlatformIO 빌드. 빌드할 프로젝트 목록은 아래 matrix.project가 정본이다.
# sim job 이름("환경 로딩 + PPO 스모크")은 실제 검사 범위보다 좁다. 이 이름은 required
# status check와 묶여 있어서 바꾸지 않는다. 바꾸는 순서는 sim job의 name 위 주석에 있다.
#
# 검사 내용 자체는 tasks.py가 갖고 있고 CI는 그걸 호출만 한다. 예전엔 PPO 스모크 코드가
# tasks.py와 이 파일 양쪽에 복사돼 있어서 "한쪽만 고치지 말 것"이라는 주석으로 버텼는데,
# 그건 언젠가 어긋난다. 이제 정본은 tasks.py 하나다 — 로컬에서 `python tasks.py check`를
# 통과하면 CI도 같은 것을 돌린다.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 같은 PR에 연달아 푸시하면 이전 실행은 취소 — 무료 러너 시간 아끼기
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim:
    # ⚠ 이 name 문자열은 main 브랜치 룰셋의 required status check 이름과 바이트 단위로
    # 같아야 한다. 여기를 고치면 룰셋이 영영 오지 않는 체크를 기다리게 되어 main 대상
    # 모든 PR이 머지 불가가 된다. 바꿔야 한다면 순서가 있다 —
    #   ① 룰셋에 새 이름을 '추가'해 둘을 병행 → ② 이 파일 변경을 머지 → ③ 옛 이름 제거.
    # (Settings → Rules → Rulesets → "main 보호 — PR·승인·CI 필수")
    name: sim — 환경 로딩 + PPO 스모크
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv가 파이썬 자체도 받아온다(pyproject.toml의 requires-python = ">=3.12").
      # 캐시 키는 uv.lock — 의존성이 안 바뀌면 다음 실행부터 설치가 거의 0초다.
      - name: uv 설치
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked: uv.lock을 그대로 쓰되, lock이 pyproject.toml과 어긋나 있으면 실패한다.
      # 즉 이 단계가 "pyproject만 고치고 lock을 갱신하지 않은" PR을 잡아내는 게이트다.
      # (--frozen은 lock을 갱신하지 않을 뿐 최신 여부를 검사하지 않는다 — 게이트가 안 된다.)
      # 리눅스 torch는 pyproject의 CPU 인덱스 설정 덕분에 CUDA 2GB 없이 받아온다.
      - name: 의존성 설치 (uv.lock 고정 버전 그대로 + lock 최신 여부 검사)
        run: uv sync --locked

      # check가 돌리는 단계 목록은 `python tasks.py graph`의 check 줄을 본다(#50). 학습은 하지 않는다.
      # 단계를 여기에 옮겨 적지 않는다. tasks.py에 단계가 늘면 이 주석만 틀린 채로 남는다.
      # tasks.py의 입력 해시 캐시는 러너가 매번 새로 뜨므로 CI에선 항상 콜드로 돈다 —
      # 일부러 캐시를 실어 나르지 않는다. CI는 "정말로 돌려본 결과"여야 하기 때문이다.
      - name: 검사 — python tasks.py check
        run: python3 tasks.py check

      - name: 학습 자료 목록·내부 링크 확인
        run: |
          python3 docs/learning/render_catalog.py --check
          python3 docs/learning/check_library.py

  firmware:
    # 2026-09-19: Arduino IDE -> PlatformIO 전환하면서 추가. 예전엔 펌웨어가 실제로
    # 컴파일되는지 아무도 CI에서 확인 안 했다(사람이 IDE를 직접 열어야 알 수 있었음) —
    # 그래서 imu_test.ino의 진짜 컴파일 버그(BNO080 기본 생성자 없음)가 한동안 안 걸렸다.
    name: firmware — PlatformIO 빌드 (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [imu_test, imu_test_i2c, throttle_serial]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PlatformIO 설치
        run: pip install platformio

      - name: pio run — ${{ matrix.project }}
        working-directory: firmware/cosmos/${{ matrix.project }}
        run: pio run
