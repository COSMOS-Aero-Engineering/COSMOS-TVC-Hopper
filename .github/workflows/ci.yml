# COSMOS CI — PR이 main에 들어가기 전에 sim 검사와 펌웨어 빌드를 자동으로 돌린다.
#
# 잡으려는 사고: 누가 코드를 고쳤는데 그게 깨진 채로 main에 들어가서,
# 다음 사람이 git pull 받은 뒤에야 "내가 뭘 잘못했나?" 하고 헤매는 것.
# 오래 걸리는 PPO 본 학습(`train`)은 돌리지 않는다. job마다 돌리는 것:
#   - sim: `python tasks.py check`, 그리고 학습 자료 목록·내부 링크 검사.
#     check가 돌리는 단계는 `python tasks.py graph`의 check 줄을 본다. 여기에 옮겨 적지 않는다.
#     check의 cad 작업을 위해 OpenSCAD를 먼저 설치한다(#61).
#   - web: lockfile대로 의존성을 설치하고 축·CSV 검사와 Vite 생산 빌드를 실행한다(#40).
#   - firmware: PlatformIO 빌드. 빌드할 프로젝트 목록은 아래 matrix.project가 정본이다.
#   - firmware-all: firmware matrix의 결과를 체크 하나("firmware — 전체")로 모은다(#103).
# sim job 이름("환경 로딩 + PPO 스모크")은 실제 검사 범위보다 좁다. 이 이름은 required
# status check와 묶여 있어서 바꾸지 않는다. 바꾸는 순서는 sim job의 name 위 주석에 있다.
# firmware-all job 이름도 required status check로 쓴다. 바꾸는 순서는 sim job과 같다.
#
# sim 검사 내용은 tasks.py가 갖고 있고, CI는 `python tasks.py check`를 호출만 한다. 예전엔 PPO
# 스모크 코드가 tasks.py와 이 파일 양쪽에 복사돼 있어서 "한쪽만 고치지 말 것"이라는 주석으로
# 버텼는데, 그건 언젠가 어긋난다. 이제 sim 검사의 정본은 tasks.py 하나다.
# 학습 자료 검사, 웹 검사·빌드, 펌웨어 빌드는 tasks.py에 없고 이 파일이 직접 돌린다. 로컬에서
# `python tasks.py check`를 통과해도 이 셋은 따로 확인해야 한다. 명령은 아래 각 단계에 있다.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 같은 PR에 연달아 푸시하면 이전 실행은 취소 — 무료 러너 시간 아끼기
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim:
    # ⚠ 이 name 문자열은 main 브랜치 룰셋의 required status check 이름과 바이트 단위로
    # 같아야 한다. 여기를 고치면 룰셋이 영영 오지 않는 체크를 기다리게 되어 main 대상
    # 모든 PR이 머지 불가가 된다. 바꿔야 한다면 순서가 있다 —
    #   ① 룰셋에 새 이름을 '추가'해 둘을 병행 → ② 이 파일 변경을 머지 → ③ 옛 이름 제거.
    # (Settings → Rules → Rulesets → "main 보호 — PR 경유 + CI 초록불 (예외 없음)")
    name: sim — 환경 로딩 + PPO 스모크
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv가 파이썬 자체도 받아온다(pyproject.toml의 requires-python = ">=3.12").
      # 캐시 키는 uv.lock — 의존성이 안 바뀌면 다음 실행부터 설치가 거의 0초다.
      - name: uv 설치
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked: uv.lock을 그대로 쓰되, lock이 pyproject.toml과 어긋나 있으면 실패한다.
      # 즉 이 단계가 "pyproject만 고치고 lock을 갱신하지 않은" PR을 잡아내는 게이트다.
      # (--frozen은 lock을 갱신하지 않을 뿐 최신 여부를 검사하지 않는다 — 게이트가 안 된다.)
      # 리눅스 torch는 pyproject의 CPU 인덱스 설정 덕분에 CUDA 2GB 없이 받아온다.
      - name: 의존성 설치 (uv.lock 고정 버전 그대로 + lock 최신 여부 검사)
        run: uv sync --locked

      # check의 cad 작업(CAD 검증 echo, #61)이 OpenSCAD를 쓴다. cad 작업은 CI에서 OpenSCAD를
      # 찾지 못하면 건너뛰지 않고 실패한다. 이 단계를 지우면 sim job이 빨간불이 된다.
      # Ubuntu 저장소 판(24.04는 2021.01)을 쓴다. OpenSCAD 내려받기 페이지가 안내하는 방법이고,
      # 부장 PC의 판(cad/README.md)과 같다. GitHub 문서대로 설치 전에 apt-get update를 한다.
      - name: OpenSCAD 설치 (CAD 검증 echo용)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad
          openscad --version

      # check가 돌리는 단계 목록은 `python tasks.py graph`의 check 줄을 본다(#50). 학습은 하지 않는다.
      # 단계를 여기에 옮겨 적지 않는다. tasks.py에 단계가 늘면 이 주석만 틀린 채로 남는다.
      # tasks.py의 입력 해시 캐시는 러너가 매번 새로 뜨므로 CI에선 항상 콜드로 돈다 —
      # 일부러 캐시를 실어 나르지 않는다. CI는 "정말로 돌려본 결과"여야 하기 때문이다.
      - name: 검사 — python tasks.py check
        run: python3 tasks.py check

      - name: 학습 자료 목록·내부 링크 확인
        run: |
          python3 docs/learning/render_catalog.py --check
          python3 docs/learning/check_library.py

  web:
    name: web — 축 검사 + Vite 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 24 설치 + npm 캐시
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: package-lock.json 고정 의존성 설치
        run: npm ci

      - name: 축·CSV·베인 부호 검사
        run: npm run check

      - name: Vite 생산 빌드
        run: npm run build

  firmware:
    # 2026-09-19: Arduino IDE -> PlatformIO 전환하면서 추가. 예전엔 펌웨어가 실제로
    # 컴파일되는지 아무도 CI에서 확인 안 했다(사람이 IDE를 직접 열어야 알 수 있었음) —
    # 그래서 imu_test.ino의 진짜 컴파일 버그(BNO080 기본 생성자 없음)가 한동안 안 걸렸다.
    name: firmware — PlatformIO 빌드 (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [imu_test, imu_test_i2c, throttle_serial]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PlatformIO 설치
        run: pip install platformio

      - name: pio run — ${{ matrix.project }}
        working-directory: firmware/cosmos/${{ matrix.project }}
        run: pio run

  firmware-all:
    # firmware matrix는 프로젝트마다 체크를 하나씩 만든다("firmware — PlatformIO 빌드 (<프로젝트>)").
    # 이 이름을 룰셋에 하나씩 넣으면, 프로젝트를 더하거나 뺄 때마다 룰셋도 고쳐야 한다.
    # 그래서 이 job이 matrix 결과를 체크 하나로 모으고, 룰셋에는 이 job의 name만 넣는다(#103).
    #
    # `if: always()`를 지우지 않는다. 지우면 firmware가 실패할 때 이 job은 skipped가 된다.
    # GitHub은 skipped job을 "Success"로 보고하고, required check여도 머지를 막지 않는다.
    # always()는 실행을 취소해도 이 job을 돌린다. 그때 결과는 cancelled라서 이 job은 실패한다.
    # always()의 공식 경고는 소스 받기처럼 실패하면 멈출 수 있는 단계를 말한다. 이 job에는 checkout이 없다.
    #
    # ⚠ 이 name 문자열은 main 룰셋의 required status check 이름과 바이트 단위로 같아야 한다.
    # 바꾸는 순서는 sim job의 name 위 주석과 같다.
    name: firmware — 전체
    needs: [firmware]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # needs.firmware.result는 matrix 전체를 합친 결과 하나다(success, failure, cancelled, skipped).
      # 프로젝트별 결과는 needs로 받을 수 없다. success만 통과시키고 skipped도 실패로 본다.
      - name: firmware matrix 결과 확인
        env:
          RESULT: ${{ needs.firmware.result }}
        run: |
          echo "needs.firmware.result = $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::firmware 빌드 결과가 success가 아니다($RESULT). 'firmware — PlatformIO 빌드 (<프로젝트>)' 체크의 로그를 연다."
            exit 1
          fi
