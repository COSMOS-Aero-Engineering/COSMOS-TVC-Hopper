# sim 패키지 — 강화학습 환경과 학습 스크립트의 의존성 정의.
#
# 여기가 sim 의존성의 정본이다. `sim/requirements.txt`는 이 파일에서 생성되는 사본이며,
# 버전을 바꿀 땐 이 파일을 고치고 `python tasks.py lock`으로 lock과 requirements.txt를
# 함께 다시 만든다. requirements.txt만 손으로 고치면 uv.lock과 어긋난다.
#
# 버전을 고정하는 이유: 버전을 안 박아두면 부원마다 다른 gymnasium/SB3가 깔린다. 그러면
# 학습 결과가 재현되지 않고, 문제가 생겼을 때 "코드가 틀렸나, 환경이 다른가"를 구분할 수
# 없다. RL은 원래 결과가 튀는 분야라 환경 변수를 하나라도 줄여놔야 한다.
#
# 버전을 올릴 땐: sanity + smoke를 먼저 돌려보고, PR 설명에 "왜 올렸는지"를 남긴다.

[project]
name = "cosmos-sim"
version = "0.1.0"
description = "COSMOS TVC 호퍼 — 자세 제어 강화학습 환경"
requires-python = ">=3.12"

dependencies = [
    "gymnasium==1.3.0",
    "numpy==2.5.3",
    "PyYAML==6.0.3",
    "stable_baselines3==2.9.0",
    # torch는 원래 stable_baselines3가 끌고 오는 전이 의존성이다. 여기에 직접 적어둔 건
    # 아래 [tool.uv.sources]로 리눅스 휠을 CPU 인덱스로 보내기 위해서다 — uv의 sources는
    # 직접 의존성에만 적용되고 전이 의존성은 그냥 PyPI에서 가져온다(= CI에서 CUDA 2GB).
    # 범위로 둔 이유: 정확한 버전은 uv.lock이 플랫폼별로 못박으므로 여기서 한 점에 묶을
    # 필요가 없고, 메이저 점프만 막아두면 된다.
    "torch>=2.14,<3",
]

[tool.uv.sources]
# 리눅스(= CI 러너, 리눅스 부원 PC)에서만 PyTorch CPU 인덱스를 쓴다.
# Windows/macOS 기본 휠은 원래 CPU 전용이라 PyPI 그대로 두는 게 맞다.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.uv]
# sim은 라이브러리가 아니라 스크립트 묶음이다(sim_stage1/을 직접 실행한다).
# 설치 가능한 패키지로 만들면 빌드 백엔드와 src 레이아웃이 따라붙는데, 얻는 게 없다.
package = false
