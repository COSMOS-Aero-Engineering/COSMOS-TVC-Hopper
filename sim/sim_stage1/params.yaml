# PRJ-01 TVC 호퍼 — 시뮬레이션 물리 파라미터
# ⚠️ "PLACEHOLDER" 표시된 값은 전부 임시값. 실측/실험 데이터 나오면 이 파일만 교체하면
#    sim/hopper_aviary.py 코드는 손대지 않아도 됨 (일부러 그렇게 분리해둠).

# --- 질량 특성 ---
mass: 0.735          # kg, PLACEHOLDER — 01-avionics-integration-final.md §8.1 AUW 추정(마스터 §5.1의 660 g은 합계 오류). 조립 후 저울 실측 필요. Stage 1 동역학은 이 값을 안 쓴다
Jxx: 0.005           # kg*m^2, PLACEHOLDER — Onshape 질량 속성(재질 지정 후) 계산 또는 바이필라 진자 실험으로 재산출
Jyy: 0.005           # kg*m^2, PLACEHOLDER — 좌우 대칭 가정으로 Jxx와 동일하게 둠
Jzz: 0.002           # kg*m^2, PLACEHOLDER — 세로축 관성모멘트, 가장 부정확할 가능성 높음

# --- 형상 (실제 CAD 값 — cad/hopper_params.scad 2026-09-13 기준, PLACEHOLDER 아님) ---
# l = 무게중심 → 베인 피벗 세로 거리(modelling-notes-ch3.md §3). 링 반지름(48 mm)이 아니다(#21).
#   피벗 z = -36 mm(hopper_params.scad의 vane_pivot_z), 무게중심 z ≈ 68 mm(01-avionics §8.4 계산값,
#   목표 60~75 mm) → l ≈ 104 mm(목표 범위 96~111 mm). 마스터 §5.3의 CG 140~180 mm는 01번 §8.4가
#   "도달 불가"로 정정했다. #26의 CAD 무게중심 추정과 조립 후 실측(01번 §8.3)으로 교체할 것.
vane_arm_l: 0.104    # m, PLACEHOLDER — 위 계산값
vane_arm_r: 0.018    # m, PLACEHOLDER — 요 모멘트암 = z축 → 베인 압력중심 반경(#34). A_fin과 같은 가정을 쓴다:
                     # 베인 안쪽 끝 4 mm(cad vane_inner_r)부터 배기 내경 반경 32 mm까지 잠기고 축방향 유속이 균일 → (4+32)/2 = 18 mm.
                     # 꼬리 원뿔(허브) 뒤 안쪽은 실제로 유속이 작아 중심이 바깥으로 갈 수 있다(허브 지름 근거 없음, 추정).
                     # 그 불확실성은 domain_rand.vane_arm_r_range로 덮는다. 예전 0.048은 베인 링 반지름이라 정의와 달랐다.
                     # 배기 내경·허브 지름 실측 후 A_fin과 함께 다시 계산

# --- 베인 공력 (modelling-notes-ch3.md §2.2의 (B) 기하 기반) ---
# 베인 1장 측력 F = Ft · CL · alpha,  CL = CLalpha · A_fin / (2 · A_duct)   (논문 식 3.16)
# hopper_aviary.py가 CL을 계산한다. 예전 CLalpha 0.008905는 원저자 MATLAB의 "뭉쳐진 CL"이었는데
# 코드가 기하 인자 없이 그대로 써서 제어력이 과소 추정됐다(#21).
#
# CLalpha: 유한 날개 양력 기울기(1/rad).
#   2D 기울기 a0 = 0.1081/deg = 6.194/rad (논문 부록 B.3, Joukovsky 익형 XFoil 회귀)
#   종횡비 AR = 잠긴 스팬 28 mm / 시위 25 mm = 1.12 (스팬 = 제트 반지름 32 - vane_inner_r 4)
#   Helmbold 저종횡비 보정 a = a0 / (sqrt(1 + (a0/(pi·AR))^2) + a0/(pi·AR)) = 1.637/rad
#   베인을 고립된 날개로 본 값이다. 덕트 벽의 끝판 효과는 넣지 않았다(넣으면 커진다).
CLalpha: 1.637       # 1/rad, PLACEHOLDER — TC-2(베인각별 복원 모멘트) 실측 회귀로 교체
# A_fin: 제트 안에 잠긴 베인 면적. CAD 베인은 반경 4~41 mm(37 mm) × 시위 25 mm인데,
#   제트 반지름 32 mm 바깥 부분은 제트 밖이라 뺐다 → 28 mm × 25 mm.
A_fin: 7.0e-4        # m^2, PLACEHOLDER — 배기 내경 실측 후 다시 계산
# A_duct: 배기 단면적. 64 mm급 EDF 공칭 지름으로 원 전체 넓이를 잡았다(pi·0.032^2).
#   모터 꼬리 원뿔 단면을 빼면 A_duct가 작아지고 CL이 커진다 — 실측 전에는 작은 쪽 CL을 쓴다.
A_duct: 3.217e-3     # m^2, PLACEHOLDER — EDF 배기 내경·꼬리 원뿔 지름 실측 필요
# 상한: 한 축 베인 2장의 측력 합 2·CL·alpha_max·Ft는 Ft·sin(alpha_max)를 넘지 못한다(제트 운동량).
#   지금 값: 0.0621·Ft, 상한 0.1736·Ft의 36%. hopper_aviary.py가 넘으면 ValueError를 낸다.
CD0: 0.001054        # PLACEHOLDER — 원저자 MATLAB의 뭉쳐진 값(raw는 부록 B.3의 0.0145). 지금 동역학 코드는 안 쓴다
alpha_max_deg: 10    # 선형 근사 유효 범위 (논문 명시값, 서보 물리적 최대각과는 별개)

# --- 모터/추력 모델 (PLACEHOLDER — 실험 A 전까지 임시 스케일, 절대값 의미 없음) ---
# 2026-09-19: 기존 3.0e-8은 100% 스로틀에서 Ft=0.27N — 64mm급 EDF 실제 정적추력(8~12N)의
# 1/37 수준이었다(PR #9 리뷰 중 발견, sim/connectome 작업과 무관하게 실재하는 값 오류).
# 5초간 최대 토크를 다 써도 5.8°밖에 못 바꾸는 수준이라, 이 상태로는 어떤 제어기(PID도
# RL도)도 초기 교란(최대 17°)을 못 이겨서 비교 실험 자체가 성립하지 않았다.
# 아래 1.1e-6은 목표 정적추력을 중간값(10N)으로 잡고 역산한 잠정값 — 여전히 PLACEHOLDER다.
# 실험 A(EDF 추력곡선 실측)가 나오면 반드시 교체할 것.
Kf: 1.1e-6           # PLACEHOLDER(역산값), Ft = Kf * omega_t_equiv^2 (omega_t_equiv는 실제 rpm 아니고 throttle 기반 임시 스케일)
# omega_t_per_throttle: 스로틀 → 추력 환산 상수. omega_t_equiv = throttle(0-1) * omega_t_per_throttle.
#   단위는 임의 단위다. omega_t_equiv는 실제 rpm도 rad/s도 아니고 throttle을 키운 값일 뿐이다.
#   Kf 1.1e-6은 이 값 3000을 전제로 역산했다: 100% 스로틀 Ft = Kf * 3000^2 = 9.9 N.
#   둘 중 하나만 바꾸면 최대 추력이 바뀐다. hopper_aviary.py, yaw_check.py, connectome/authority.py가 이 값을 읽는다(#87).
#   실험 A 뒤 실제 회전수 기반 추력 모델로 Kf와 함께 바꾼다
omega_t_per_throttle: 3000.0   # 임의 단위(실제 rpm 아님), PLACEHOLDER

# --- 도메인 랜덤화 (매 에피소드마다 아래 비율 범위 안에서 물리 상수를 무작위로 흔들어서 학습)
#     목적: 지금 값들이 전부 PLACEHOLDER라 정확한 값을 모름 → 학습된 정책이 "이 근처 어딘가"의
#     실제값에도 버티도록 만드는 것. 나중에 실측값이 나와도 이 블록은 그대로 두면 됨
#     (오히려 실측 이후에도 계속 쓰는 게 sim-to-real 갭을 줄여주는 정석적인 방법).
domain_rand:
  enabled: true
  Jxx_range: 0.3        # ±30% 균등분포로 흔듦
  Jyy_range: 0.3
  Jzz_range: 0.3
  vane_arm_range: 0.15  # ±15%, 롤·피치 팔 l (무게중심 높이 오차 근사)
  vane_arm_r_range: 0.25  # ±25% (13.5-22.5 mm), 요 팔 r. l과 다른 치수라 따로 흔든다(#34). 허브 차폐로 압력중심이 바깥으로 갈 가능성까지 덮는다
  Kf_range: 0.2         # ±20%, 모터 개체차·배터리 전압 편차 근사
  # 무게중심-추력축 어긋남(축당 mm). 근거: 01-avionics §8.2 횡 CG 목표 ≤ 3 mm(설계 잔차 1.9 mm).
  # 베인 최대 제어력의 등가 오프셋은 2·CL·alpha_max·l = 6.5 mm(l 최소 -15%에서 5.5 mm)라 그 안쪽이다.
  cg_offset_mm: 3.0

# --- EDF 회전자 반작용·자이로 항 (#86) ---
# 스위치 enabled의 기본값은 false(끔)다. 켜면 hopper_aviary.py step()이 두 토크를 더한다.
#   회전자 각운동량  h = s·I_r·Ω·e_z  (s = spin_dir, Ω = 바디 기준 회전자 각속도, e_z = 바디 +Z)
#   반작용  τ = −dh/dt        → τz = −s·I_r·dΩ/dt (스로틀을 바꿀 때만 생긴다)
#   자이로  τ = −ω × h        → τx = −s·I_r·Ω·ωy, τy = +s·I_r·Ω·ωx, τz = 0
# 식의 근거와 유도, 상수 추정 계산은 docs/design/modelling-notes-ch3.md §3의 "EDF 회전자 반작용·자이로 항"에 있다.
# 아래 상수는 전부 공개 자료와 가정으로 잡은 추정값(PLACEHOLDER)이다. 실측값이 아니다.
# 산 EDF로 회전수(회전계)와 회전 방향을 재서 바꾼다(실험 A, TC-0).
# 이 값들은 랜덤화하지 않는다. #98이 _randomize_episode_params의 난수 흐름을 바꾸는 중이라서다(랜덤화는 #121).
# 범위를 돌려 보려면 아래 값을 손으로 바꿔서 python yaw_check.py를 돌린다.
rotor:
  enabled: false     # 기본 끔. 켜면 pd_gate.py·yaw_check.py의 판정도 이 항을 넣은 환경으로 한다
  inertia: 1.0e-5    # kg·m², PLACEHOLDER(추정) — 임펠러 + 아웃러너 모터 캔. 범위 5e-6 - 3.5e-5
  omega_max: 3800.0  # rad/s(약 36,300 rpm), PLACEHOLDER(추정) — 스로틀 100 %의 부하 회전수 = KV × 4S 전압 × 부하율. 범위 3100 - 4000
                     # Ω = omega_max · throttle로 둔다. 환경의 추력이 스로틀²에 비례하므로(Ft ∝ Ω²) 그 모델과 맞는다
  tau: 0.05          # s, PLACEHOLDER(가정) — 회전수의 1차 지연 시상수. 범위 0.03 - 0.15. 0이면 지연 없음
                     # 회전수가 바뀔 때 주고받는 각운동량 I_r·ΔΩ는 tau와 상관없다. tau는 토크가 퍼지는 시간만 바꾼다
  spin_dir: 1        # PLACEHOLDER — +1: 회전자 각속도가 +Z(위, 흡기 쪽)를 향한다 = 흡기 쪽에서 내려다보면 반시계. −1은 반대
                     # EDF 제품마다 다르다(CW·CCW 판이 따로 있다). TC-0에서 산 EDF의 회전 방향을 보고 정한다
